<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offers Companion - LTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="resources.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#12173A; --muted:#8B8F9B; --line:#E8E9EB; --bg:#F4F7F9;
    --orange:#F26900; --orange-dark:#D95E00; --orange-soft:#FEF0E5; --orange-tint:#FEF7F1;
    --green:#00AB8E; --green-soft:#E6F7F3; --green-dark:#007A66; --blue:#19155E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Open Sans',Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:var(--orange);text-decoration:none} a:hover{color:var(--orange-dark)}
  input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
  button{font-family:inherit}
  h1,h2,p{margin:0}

  .shell{display:flex;justify-content:center;min-height:100vh}
  .phone{width:100%;max-width:430px;background:#fff;min-height:100vh;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .page{padding:24px 20px 32px;display:flex;flex-direction:column;gap:16px}

  .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--orange);text-transform:uppercase}
  .title{font-size:20px;font-weight:800;margin:6px 0 4px}
  .sub{font-size:13px;color:var(--muted);line-height:1.5}
  .small-label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}

  .wordmark{font-weight:800;font-size:18px;letter-spacing:-0.5px;color:var(--ink)}
  .wordmark span{color:var(--orange)}
  .logo-img{height:22px;width:auto;max-width:120px;display:block;object-fit:contain}
  .welcome-logo .logo-img{height:34px;max-width:180px}

  .btn{height:44px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
  .btn:disabled{opacity:.4;cursor:default}
  .btn-ghost{height:40px;border:1px solid var(--orange);background:#fff;color:var(--orange);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;width:100%}
  .link-btn{background:none;border:none;padding:0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:left}
  .link-btn.orange{color:var(--orange)}
  .input{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;color:var(--ink);width:100%}
  textarea.input{height:auto;padding:12px;resize:none}
  label.lbl{font-size:12px;font-weight:700;display:block;margin-bottom:6px}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  .avatar{width:28px;height:28px;border-radius:100px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}

  .steps{background:var(--bg);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .step{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .step.locked{cursor:default;opacity:.55}
  .dot{width:28px;height:28px;border-radius:100px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step.locked .dot{background:var(--line);color:var(--muted)}
  .step-title{font-size:14px;font-weight:700}
  .step-desc{font-size:11px;color:var(--muted);margin-top:2px}
  .chip{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink);background:var(--bg);border-radius:100px;padding:4px 10px;white-space:nowrap}
  .step.locked .chip{color:var(--muted)}

  .card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff}
  .card.click{cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px}
  .card-title{font-size:15px;font-weight:800}
  .card-title.sm{font-size:13px;font-weight:700}

  .choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer}
  .choice b{font-size:14px;font-weight:700;display:block}
  .choice span{font-size:11px;color:var(--muted);margin-top:2px;display:block}

  .group-h{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .topic{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 14px;cursor:pointer;font-size:13px;font-weight:600}
  .topic.on{border-color:var(--orange);background:var(--orange-tint)}
  .check{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topic.on .check{border-color:var(--orange);background:var(--orange)}

  .res{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}
  .res .tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--bg);color:var(--ink);border-radius:4px;padding:3px 7px;flex-shrink:0;min-width:56px;text-align:center}
  .res .tag.fill{color:#fff}
  .res .t{flex:1;font-size:12px;font-weight:600;line-height:1.4}
  .res svg{width:14px;height:14px;flex-shrink:0}
  .offer-sec{border:1px solid var(--line);border-left:6px solid var(--o);border-radius:12px;background:#fff;overflow:hidden}
  .offer-head{background:var(--o);color:#fff;padding:12px 16px}
  .offer-head .oh-k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.85}
  .offer-head .oh-t{font-size:16px;font-weight:800;margin-top:2px}
  .offer-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
  .sub-block .sb-t{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .sub-block .sb-t i{width:8px;height:8px;border-radius:100px;background:var(--o);display:inline-block}
  .res .tag.o{background:var(--o);color:#fff}
  .protip{background:var(--ink);color:#fff;border-radius:12px;padding:16px 18px}
  .protip .card-title{color:#fff}
  .protip p{font-size:12px;line-height:1.55;color:#C9CBD6;margin-top:4px}
  .protip a{color:#F7A566;font-weight:700;word-break:break-all}

  .hero{background:var(--ink);border-radius:20px;padding:28px 24px;color:#fff}
  .hero .eyebrow{color:#F7A566}
  .hero h2{font-size:22px;font-weight:800;margin:8px 0;color:#fff}
  .hero p{font-size:13px;line-height:1.55;color:#B9BCC9}

  .qmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .bar{height:6px;background:var(--bg);border-radius:100px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--orange);border-radius:100px;transition:width .3s}
  .qtext{font-size:18px;font-weight:800;line-height:1.35;margin-top:4px}
  .opt{padding:14px 16px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;font-weight:600;line-height:1.4;cursor:pointer}
  .opt.picked{border-color:var(--ink);background:var(--bg)}
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green-dark)}
  .opt.wrong{border-color:var(--orange);background:var(--orange-soft);color:#C25400}
  .opt.done{cursor:default}
  .why{font-size:12px;line-height:1.5;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

  .scorebox{background:var(--bg);border-radius:20px;padding:24px;text-align:center}
  .scorebox .big{font-size:44px;font-weight:800;margin:4px 0}
  .scorebox .big small{font-size:20px;color:var(--muted);font-weight:700}
  .lb{border:1px solid var(--line);border-radius:12px;padding:16px 16px 8px}
  .lb-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .lb-h b{font-size:14px;font-weight:800}
  .lb-h span{font-size:11px;color:var(--muted);font-weight:600}
  .row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px}
  .row.me{background:var(--orange-soft)}
  .row .rk{width:24px;font-size:12px;font-weight:700;color:var(--muted)}
  .row .nm{flex:1;font-size:13px;font-weight:600}
  .row.me .nm{font-weight:800}
  .row .pt{font-size:13px;font-weight:800}
  .row.me .pt{color:var(--orange)}
  .live{display:inline-flex;align-items:center;gap:5px}
  .live i{width:7px;height:7px;border-radius:100px;background:var(--green);display:inline-block}
  .live.off i{background:var(--muted)}

  .qa{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px}
  .qa.mine{border-color:var(--orange);background:var(--orange-tint)}
  .qa .qt{font-size:13px;line-height:1.5}
  .qa .qm{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

  .nav{display:flex;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
  .nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 14px;font-size:10px;font-weight:700;cursor:pointer;color:var(--muted)}
  .nav div.on{color:var(--orange)}
  .nav svg{width:20px;height:20px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:10px 14px;border-radius:100px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .list{display:flex;flex-direction:column;gap:8px}
  .list.g12{gap:12px}
  .list.g16{gap:16px}
  .list.g6{gap:6px}
  .bullets{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .bullet{display:flex;gap:10px;font-size:13px;line-height:1.5}
  .bullet i{width:5px;height:5px;border-radius:100px;background:var(--orange);margin-top:7px;flex-shrink:0}

  /* Host / projector view */
  .host{max-width:none;background:var(--bg);padding:32px clamp(16px,4vw,64px)}
  .host-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;max-width:900px;margin:0 auto}
  .host .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 28px}
  .host .row{padding:12px 14px}
  .host .row .nm{font-size:18px}
  .host .row .pt{font-size:20px}
  .host .row .rk{font-size:15px;width:36px}
  .host .row.top1{background:var(--orange-soft)}
  .host h1{font-size:28px;font-weight:800}
  .host .stat{font-size:13px;color:var(--muted);font-weight:600}
  .host-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .host .btn-ghost{width:auto;padding:0 16px}
  @media (max-width:800px){.host-grid{grid-template-columns:1fr}}

  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .phone{max-width:none;min-height:0}
    .scroll{overflow:visible}
    .res .t::after{content:" - " attr(data-url);font-weight:400;color:#555;font-size:10px;word-break:break-all}
    .protip{background:#fff;color:#000;border:1px solid #000}
    .protip .card-title,.protip p{color:#000}
    .protip a{color:#000}
  }
</style>
</head>

async function loadLeaderboard(){
  if (!db) return;
  const { data, error } = await db.from('participants').select('name,score,quiz_done,updated_at').eq('quiz_done', true).order('score',{ascending:false}).order('updated_at',{ascending:true}).limit(200);
  if (!error && data){ LB = data; lastPoll = Date.now(); render(); }
}
async function upsertParticipant(patch){
  if (!db || !S.name) return;
  const row = Object.assign({ name: S.name, updated_at: new Date().toISOString() }, patch);
  const { error } = await db.from('participants').upsert(row, { onConflict: 'name_key' });
  if (error){ console.error(error); toast('Could not save - check your connection'); }
}
function subscribe(){
  if (!db) return;
  db.channel('room')
    .on('postgres_changes', { event:'*', schema:'public', table:'participants' }, () => loadLeaderboard())
    .subscribe(status => { LIVE = status === 'SUBSCRIBED'; render(); });
  // safety net in case realtime drops
  setInterval(() => { if (!LIVE || Date.now() - lastPoll > 15000) loadLeaderboard(); }, 8000);
}

  return `<div class="phone">
    <div class="topbar noprint">${logo()}<div class="who"><div class="avatar">${esc(initials(S.name))}</div><span>${esc(S.name)}</span></div></div>
    <div class="scroll">${content}</div>
    ${nav(d)}
  </div>`;
}

function hostView(){
  const done = LB.length;
  return `<div class="phone host">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:16px">${logo()}<div><h1>Offers as a way of growing</h1><div class="stat">Session leaderboard \u00b7 <span class="live ${LIVE?'':'off'}"><i></i>${LIVE?'live':'refreshing'}</span> \u00b7 ${done} ${done===1?'score':'scores'} in</div></div></div>
      <div class="host-actions"><button class="btn-ghost" data-act="refresh">Refresh</button><button class="btn-ghost" data-act="reset">Reset session\u2026</button></div>
    </div>
    <div class="host-grid">
      <div class="panel">${leaderboard(true)}</div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const active = document.activeElement; const activeKey = active && active.dataset ? active.dataset.input : null;
  const selStart = active && active.selectionStart;
  app.innerHTML = IS_HOST ? hostView() : (S.screen === 'welcome' ? welcome() : main());
  if (activeKey){ const el = app.querySelector(`[data-input="${activeKey}"]`); if (el){ el.focus(); try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
}

/* ======================= ACTIONS ======================= */
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  S[k] = e.target.value;
  const btn = e.target.parentElement.querySelector('[data-act="start"]');
  if (btn) btn.disabled = !S.nameInput.trim();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'nameInput') act('start'); });
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el.dataset); });

async function act(a, ds = {}){
  const d = derived();
  switch (a){
    case 'start': { const n = S.nameInput.trim(); if (!n) return; save({ name:n, screen:'main' }); upsertParticipant({}); break; }
    case 'goHome': save({ tab:'home', view:'root' }); break;
    case 'goQuiz': save({ tab:'quiz' }); break;
    case 'goTopics': if (d.topicsUnlocked) save({ tab:'home', view:'topics' }); break;
    case 'goSummary': if (d.summaryUnlocked) save({ tab:'home', view:'summary' }); break;
    case 'goToolkit': save({ tab:'home', view: d.summaryUnlocked ? 'summary' : (d.topicsUnlocked ? 'topics' : 'root') }); break;
    case 'sitYes': save({ situation:'yes', topicsConfirmed:false, view:'topics', tab:'home' }); break;
    case 'sitNo': save({ situation:'no', topics:[], topicsConfirmed:true, view:'summary', tab:'home' }); upsertParticipant({ situation:'no', topics:[] }); break;
    case 'toggle': { const id = ds.id; const t = S.topics.includes(id) ? S.topics.filter(x => x !== id) : S.topics.concat(id); save({ topics:t, topicsConfirmed:false }); break; }
    case 'confirmTopics': if (S.topics.length){ save({ topicsConfirmed:true, view:'summary' }); upsertParticipant({ situation:'yes', topics:S.topics }); } break;
    case 'download': downloadPdf(); break;
    case 'startQuiz': save({ quizStage:'question', qIndex:0, correct:0, selected:null, order: QUIZ.map(q => shuffle(q.o.map((_, i) => i))) }); break;
    case 'pick': { if (S.selected != null) return; const i = Number(ds.i); save({ selected:i, correct: S.correct + (i === QUIZ[S.qIndex].c ? 1 : 0) }); break; }
    case 'next':
      if (S.qIndex + 1 < QUIZ.length) save({ qIndex:S.qIndex+1, selected:null });
      else { save({ quizStage:'result', quizDone:true, score:S.correct, selected:null }); await upsertParticipant({ score:S.correct, quiz_done:true }); loadLeaderboard(); }
      break;
    case 'resultCta': save({ tab:'home', view: d.summaryUnlocked ? 'summary' : 'topics' }); break;
    case 'refresh': loadLeaderboard(); toast('Refreshed'); break;
    case 'reset': {
      const pin = prompt('This clears every score. Enter the host PIN to confirm:'); if (pin == null) return;
      const { error } = await db.rpc('reset_session', { p_pin: pin });
      if (error) toast('Wrong PIN - nothing was deleted'); else { toast('Session reset'); loadLeaderboard(); }
      break;
    }
  }
}

function downloadPdf(){
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J){ window.print(); return; }
  const doc = new J({ unit:'pt', format:'a4' });
  const Wp = 595, M = 48, maxW = Wp - 2*M; let y = M;
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const ink = hex('#12173A'), muted = hex('#8B8F9B'), orange = hex('#F26900');
  const need = h => { if (y + h > 842 - M){ doc.addPage(); y = M; } };
  const text = (s, size, color, bold, indent=0) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(s, maxW - indent); need(lines.length * size * 1.35);
    doc.text(lines, M + indent, y); y += lines.length * size * 1.35;
  };
  const link = (label, url, indent) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    const lines = doc.splitTextToSize(label, maxW - indent - 8); need(lines.length * 13.5 + 12);
    doc.text(lines, M + indent, y); doc.link(M + indent, y - 9, maxW - indent, lines.length * 13.5, { url });
    y += lines.length * 13.5; doc.setFontSize(8); doc.setTextColor(...muted); doc.textWithLink(url, M + indent, y, { url }); y += 14;
  };
  text('Offers as a way of growing', 9, orange, true); y += 2;
  text(S.name + "'s Offer Toolkit", 20, ink, true); y += 4;
  if (S.situation === 'yes'){
    toolkitData().forEach(sec => {
      y += 8; need(40); const c = hex(sec.op.color);
      doc.setFillColor(...c); doc.rect(M, y - 12, maxW, 26, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(sec.op.label, M + 10, y + 5); y += 26;
      link(sec.op.label + ' - Offer page on ltplabs.com', sec.op.href, 0); y += 2;
      sec.items.forEach(it => {
        y += 4; text(it.name, 11, c, true); y += 2;
        link(it.name + ' - sub-offer page', it.page, 12);
        it.links.forEach(r => link(r.t + ': ' + r.l, r.h, 12));
      });
    });
  } else {
    text('Unlock these conversations yourself', 13, ink, true); y += 4;
    PLAYBOOK.forEach(p => text('- ' + p, 10, ink, false)); y += 8;
    text('Your hooks - the three Offer pages', 11, ink, true); y += 4;
    Object.values(OFFER_PAGES).forEach(op => link(op.label + ' - Offer page on ltplabs.com', op.href, 0));
  }
  y += 10; need(50); doc.setFillColor(...ink); doc.rect(M, y - 12, maxW, 44, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255); doc.text('Pro tip', M + 10, y + 4);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.textWithLink('Visit our Demo Hub at ' + DEMO_HUB + ' for a proper showcase of what each Offer is building.', M + 10, y + 20, { url: DEMO_HUB });
  doc.save((S.name || 'my').replace(/[^a-z0-9]+/gi,'-') + '-offer-toolkit.pdf');
  toast('PDF downloaded');
}

/* ======================= BOOT ======================= */
render();
loadLeaderboard();
subscribe();
</script>
